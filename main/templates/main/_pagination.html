{% if page.has_other_pages %}
<nav class="pagination" aria-label="Страницы">
  {% if page.has_previous %}
    <a class="btn ghost small" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page.previous_page_number }}">Назад</a>
  {% endif %}
  <span class="muted">Страница {{ page.number }} из {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}
    <a class="btn ghost small" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page.next_page_number }}">Вперёд</a>
  {% endif %}
</nav>
{% endif %}
